name: CI

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  quality:
    name: Qualité (lint, format, tests)
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Installation de Python
        run: uv python install

      - name: Installation des dépendances
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check asyncvnc2.py test_asyncvnc2.py test_reseau_local.py test_live_x11vnc.py test_loguru_regles.py scripts/audit_debug_sorties.py

      - name: Formatage (ruff format --check)
        run: uv run ruff format --check asyncvnc2.py test_asyncvnc2.py test_reseau_local.py test_live_x11vnc.py test_loguru_regles.py scripts/audit_debug_sorties.py

      - name: Tests et couverture (unittest, seuil lu dans pyproject.toml)
        # Suite documentée dans CLAUDE.md « Commandes de qualité » : aucun
        # vrai serveur VNC nécessaire (test_reseau_local.py dialogue avec un
        # serveur RFB minimal sur 127.0.0.1). Couverture lignes + branches,
        # seuil bloquant `fail_under` (issue #54).
        run: |
          uv run coverage run -m unittest test_asyncvnc2 test_reseau_local -v
          uv run coverage report

      - name: Journalisation loguru (issue #55, SOCLE §8)
        # Règles AST (pas de logging stdlib, format {}, pas de secret, except
        # journalisé) + audit « debug en entrée et à chaque sortie » : la
        # référence scripts/audit_debug_sorties.baseline ne peut que baisser.
        run: |
          uv run python3 -m unittest test_loguru_regles -v
          uv run python3 scripts/audit_debug_sorties.py

  python39:
    # Issue #35 : Python 3.9 reste pris en charge (python3 système de
    # RHEL/Rocky 9, cible de Gcm4). `from __future__ import annotations`
    # garde les annotations `X | None` en chaînes ; vermin vérifie qu'aucune
    # API de la bibliothèque standard postérieure à 3.9 n'est utilisée.
    name: Python 3.9 (tests, vermin)
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Python 3.9 et dépendances
        run: |
          uv python install 3.9
          uv sync -p 3.9

      - name: Tests (unittest, Python 3.9)
        run: uv run -p 3.9 python3 -m unittest test_asyncvnc2 test_reseau_local test_loguru_regles -v

      - name: Version minimale (vermin)
        run: uvx vermin --no-tips --eval-annotations -t=3.9- --violations asyncvnc2.py test_asyncvnc2.py test_reseau_local.py test_live_x11vnc.py test_live_qemu_sasl.py test_live_qemu_zywrle.py test_loguru_regles.py scripts/audit_debug_sorties.py

  live:
    # Issues #28 et #27 : repli de version et connexion inversée contre un
    # vrai serveur tiers (x11vnc / libvncserver). ASYNCVNC_LIVE=1 : un
    # x11vnc ou un Xvfb absent fait échouer le job au lieu de le sauter.
    # Issue #48 : job en conteneur (même patron que Netcross) — la VM
    # `ubuntu` du groupe maison a le label `docker` et exécute les jobs en
    # conteneur, où l'installation des paquets se fait en root sans sudo ;
    # repli ubuntu-latest (dépôt public, minutes gratuites).
    name: Serveur réel (x11vnc)
    runs-on: ${{ fromJSON(vars.RUNS_ON_DOCKER || '"ubuntu-latest"') }}
    container:
      image: ubuntu:26.04

    steps:
      - name: Prérequis du conteneur (git, certificats)
        # ubuntu:26.04 est une image minimale : ni git (checkout), ni
        # certificats (clonage HTTPS).
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates

      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Installation de Python
        run: uv python install

      - name: Installation des dépendances
        run: uv sync

      - name: x11vnc et Xvfb
        run: |
          SUDO=""; if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
          if ! command -v x11vnc >/dev/null || ! command -v Xvfb >/dev/null || ! command -v xsetroot >/dev/null; then
            $SUDO apt-get update
            $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y x11vnc xvfb x11-xserver-utils
          fi
          x11vnc -version

      - name: Tests contre x11vnc
        env:
          ASYNCVNC_LIVE: "1"
        run: uv run python3 -m unittest test_live_x11vnc -v

      - name: QEMU et Cyrus SASL
        run: |
          SUDO=""; if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
          if ! command -v qemu-system-x86_64 >/dev/null || ! command -v saslpasswd2 >/dev/null; then
            $SUDO apt-get update
            $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              qemu-system-x86 sasl2-bin libsasl2-modules openssl
          fi
          qemu-system-x86_64 --version | head -1

      - name: Tests SASL contre QEMU
        env:
          ASYNCVNC_LIVE: "1"
        run: uv run python3 -m unittest test_live_qemu_sasl -v

      - name: Tests ZYWRLE contre QEMU
        # Issue #22 : tuiles à perte (lossy=on), niveaux 1 à 3, vérité
        # terrain = screendump du moniteur QEMU.
        env:
          ASYNCVNC_LIVE: "1"
        run: uv run python3 -m unittest test_live_qemu_zywrle -v
